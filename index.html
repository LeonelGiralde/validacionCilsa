<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <h1>Formulario Cilsa</h1>
    <form  action="" method="" id="form" name="" onsubmit="return validacion()">
        <label>Nombre</label><input id="nombre" name="nombre" type="text">
        <label>Apellido</label><input id="apellido" name="apellido" type="text">
        <label>Email</label><input id="email" type="text">
        <label>Fecha de nacimiento</label><input id="fecha_nac" name="fecha_nac" type="date">
        <label>Pais de residencia</label><input id="pais" name="pais">
        
        <button type="submit" value="Enviar" class="btn btn-outline-success">Success</button>
        <p class="warnings" id="warnings"></p>
       
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>

</html>
